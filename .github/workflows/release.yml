name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  livrable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire le fichier unique
        run: python3 outils/build.py

      - name: Publier le livrable dans la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.html \
            --title "AbsenceTrack $GITHUB_REF_NAME" --generate-notes
